<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Unidad 4 p5.js</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
</head>

<body>

<script>

let angulo = 0;

function setup() {
  createCanvas(1000, 600, WEBGL);
}

function draw() {

  background(20);

  orbitControl();

  // Luces
  ambientLight(50);

  directionalLight(255,255,255,1,1,-1);

  pointLight(
    255,
    200,
    200,
    mouseX - width/2,
    mouseY - height/2,
    200
  );

  // Esfera brillante
  push();

  translate(-250,0,0);

  specularMaterial(255);

  shininess(100);

  rotateY(angulo);

  sphere(100);

  pop();

  // Cubo mate
  push();

  translate(0,0,0);

  ambientMaterial(200,80,80);

  rotateX(angulo);

  box(150);

  pop();

  // Toro
  push();

  translate(250,0,0);

  normalMaterial();

  rotateZ(angulo);

  torus(80,25);

  pop();

  angulo += 0.01;
}

</script>

</body>
</html>
